# Pull requests and pushes to main: unit tests, Helm checks, PostgreSQL integration tests,
# and the full Compose + Liquibase + Playwright acceptance run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Go unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: JavaScript syntax
        run: for f in internal/web/static/*.js scripts/*.mjs; do node --check "$f"; done

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint helm/engineering-activity -f deploy/values.example.yaml
      - name: Render with the example values
        run: helm template activity helm/engineering-activity -f deploy/values.example.yaml > /dev/null
      - name: Chart refuses to render without collection scope
        run: |
          if helm template x helm/engineering-activity --set-string images.web.tag=a,images.collector.tag=a,images.migrations.tag=a 2>/dev/null; then
            echo "chart rendered without azureDevOps.organization"; exit 1
          fi
      - name: Chart version matches VERSION
        run: |
          v=$(cat VERSION)
          grep -q "^version: $v$" helm/engineering-activity/Chart.yaml || { echo "Chart.yaml version must be $v"; exit 1; }
          grep -q "^appVersion: \"$v\"$" helm/engineering-activity/Chart.yaml || { echo "Chart.yaml appVersion must be \"$v\""; exit 1; }

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: activity
          POSTGRES_USER: activity
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U activity -d activity"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply the Liquibase changelog (no dev-seed)
        run: |
          docker run --rm --network host -v "$PWD/db/changelog:/liquibase/changelog:ro" \
            -e LIQUIBASE_COMMAND_URL=jdbc:postgresql://127.0.0.1:5432/activity \
            -e LIQUIBASE_COMMAND_USERNAME=activity -e LIQUIBASE_COMMAND_PASSWORD=ci \
            -e LIQUIBASE_COMMAND_CHANGELOG_FILE=db.changelog-master.xml \
            -e LIQUIBASE_SEARCH_PATH=/liquibase/changelog \
            -e LIQUIBASE_COMMAND_CONTEXT_FILTER=live -e LIQUIBASE_ANALYTICS_ENABLED=false \
            liquibase:4.33.0 update
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://activity:ci@127.0.0.1:5432/activity?sslmode=disable
        run: go test -count=1 ./internal/collector/... ./internal/store/...

  acceptance:
    name: Compose acceptance + Playwright
    runs-on: ubuntu-24.04
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compose, Liquibase, sample data, API, metrics and browser tests
        shell: pwsh
        run: ./scripts/test-compose.ps1 -BrowserTests
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
