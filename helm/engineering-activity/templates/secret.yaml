{{- if .Values.secrets.create }}
# Development convenience only. Production uses secrets.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "activity.fullname" . }}-secrets
  labels:
    {{- include "activity.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databasePassword }}: {{ required "secrets.values.databasePassword is required when secrets.create" .Values.secrets.values.databasePassword | quote }}
  {{ .Values.secrets.keys.azureDevOpsPat }}: {{ .Values.secrets.values.azureDevOpsPat | quote }}
  {{ .Values.secrets.keys.dashboardUsername }}: {{ .Values.secrets.values.dashboardUsername | quote }}
  {{ .Values.secrets.keys.dashboardPassword }}: {{ .Values.secrets.values.dashboardPassword | quote }}
{{- end }}
